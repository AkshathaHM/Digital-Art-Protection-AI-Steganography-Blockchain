services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ganache:
    image: trufflesuite/ganache:latest
    restart: unless-stopped
    command: --host 0.0.0.0 --networkId 1337 --deterministic --db /data
    ports:
      - "7545:8545"
    volumes:
      - ganache-data:/data

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    environment:
      IPFS_API_HTTPHEADERS_ACCESS_CONTROL_ALLOW_ORIGIN: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:5174", "http://127.0.0.1:5174"]'
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data-v2:/data/ipfs

volumes:
  mongo-data:
  ipfs-data-v2:
  ganache-data:
